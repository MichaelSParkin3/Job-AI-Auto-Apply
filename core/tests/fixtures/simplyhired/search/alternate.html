<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SimplyHired Alternate Layout</title>
  </head>
  <body>
    <main id="results">
      <section data-variant="compact">
        <div class="JobsList" role="list">
          <!-- compact layout uses divs instead of list items -->
          <div role="listitem" class="JobCardCompact" data-job-id="1001">
            <a data-testid="compact-card-link" href="/job/1001">
              Compact Backend Engineer
            </a>
          </div>
          <div role="listitem" class="JobCardCompact" data-job-id="1002">
            <a data-testid="compact-card-link" href="/job/1002">
              Compact Frontend Engineer
            </a>
          </div>
          <div role="listitem" class="JobCardCompact" data-job-id="1003">
            <a data-testid="compact-card-link" href="/job/1003">
              Compact DevOps Engineer
            </a>
          </div>
          <div role="listitem" class="JobCardCompact" data-job-id="1004">
            <a data-testid="compact-card-link" href="/job/1004">
              Compact QA Engineer
            </a>
          </div>
          <div role="listitem" class="JobCardCompact" data-job-id="1005">
            <a data-testid="compact-card-link" href="/job/1005">
              Compact Security Engineer
            </a>
          </div>
          <div role="listitem" class="JobCardCompact" data-job-id="1006">
            <a data-testid="compact-card-link" href="/job/1006">
              Compact Research Engineer
            </a>
          </div>
          <div role="listitem" class="JobCardCompact" data-job-id="1007">
            <a data-testid="compact-card-link" href="/job/1007">
              Compact ML Engineer
            </a>
          </div>
          <div role="listitem" class="JobCardCompact" data-job-id="1008">
            <a data-testid="compact-card-link" href="/job/1008">
              Compact Data Engineer
            </a>
          </div>
          <div role="listitem" class="JobCardCompact" data-job-id="1009">
            <a data-testid="compact-card-link" href="/job/1009">
              Compact Product Engineer
            </a>
          </div>
          <div role="listitem" class="JobCardCompact" data-job-id="1010">
            <a data-testid="compact-card-link" href="/job/1010">
              Compact Platform Engineer
            </a>
          </div>
        </div>
      </section>
      <section class="DetailPane" data-active="true">
        <iframe id="detail-frame" src="/job/1001/detail"></iframe>
      </section>
    </main>
  </body>
</html>
