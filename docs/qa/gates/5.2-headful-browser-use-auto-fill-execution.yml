top_issues:
  - id: QA-5.2-1
    severity: high
    summary: 'AutofillExecutor._capture_screenshot writes empty files instead of invoking Browser-Use capture APIs, so no per-field evidence is produced.'
    recommendation: 'Call the controller screenshot primitive (with selector scoping) and persist the returned bytes; fail the field when capture fails to maintain auditability.'
  - id: QA-5.2-2
    severity: high
    summary: 'Selector fallback exhaustion returns a skipped result without emitting AUTOFILL_FIELD_SKIPPED telemetry, so monitoring misses real execution failures.'
    recommendation: 'Emit AUTOFILL_FIELD_SKIPPED (with reason) whenever execution falls through all selectors, matching the skip path telemetry contract.'

